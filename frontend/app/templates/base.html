<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tecnologías Chapinas S.A.{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        .navbar {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .navbar h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 5px;
            transition: all 0.3s;
            display: block;
            background: rgba(255, 255, 255, 0.1);
        }

        .navbar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logout-btn {
            background: #e74c3c;
            padding: 0.7rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        h3 {
            color: #34495e;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        h4 {
            color: #34495e;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table th {
            background: #34495e;
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: bold;
        }

        table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #ddd;
        }

        table tbody tr:hover {
            background-color: #f8f9fa;
        }

        table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Estilos responsive */

        @media (max-width: 768px) {
            .navbar-content {
                flex-direction: column;
            }

            .navbar ul {
                flex-direction: column;
                width: 100%;
            }

            .navbar ul li a {
                text-align: center;
            }

            .container {
                padding: 1rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>🌩️ Tecnologías Chapinas S.A. - Sistema de Facturación</h1>
        <div class="navbar-content">
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/configuracion/">Configuración</a></li>
                <li><a href="/consumo/">Consumos</a></li>
                <li><a href="/consultar/">Consultar</a></li>
                <li><a href="/crear/">Crear Datos</a></li>
                <li><a href="/facturar/">Facturación</a></li>
                <li><a href="/ayuda/">Ayuda</a></li>
            </ul>
            <div class="user-info">
                <div class="user-badge">
                    👤 {{ request.session.nombre|default:"Usuario" }}
                </div>
                <a href="/logout/" class="logout-btn">
                    🚪 Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %} {% endblock %}
    </div>
</body>

</html>
